name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: Rethunk-Tech/gh-actions/setup-bun@e04e0afa3e00c59e33030fdbc7df29c15000357b # v1.7
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: CI gate
        run: bun run ci

      - name: Unit tests with coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run test:coverage

  prerelease-pack:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - uses: Rethunk-Tech/gh-actions/setup-bun@e04e0afa3e00c59e33030fdbc7df29c15000357b # v1.7
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Pack npm tarball (prerelease snapshot)
        id: pack
        run: |
          set -euo pipefail
          npm pack
          SRC=$(find . -maxdepth 1 -type f -name 'rethunk-github-mcp-*.tgz' -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)
          DEST="rethunk-github-mcp-prerelease-${{ github.sha }}.tgz"
          mv "$SRC" "$DEST"
          echo "tarball=$DEST" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-pack-prerelease-${{ github.sha }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 90
